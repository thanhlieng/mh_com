version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@mhgreatsun.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard (remove in prod for security)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy

  backend:
    build: ./MH-api
    environment:
      DATABASE_URL: postgresql://thanh:123456@host.docker.internal:5432/mhcom_db
      NODE_ENV: production
    volumes:
      - ./uploads:/usr/src/app/uploads
    # Backend is not publicly exposed; only accessible via internal network
    networks:
      - proxy
    # No Traefik labels here to keep it internal

  frontend:
    build: ./MH
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`mhgreatsun.com`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      # Redirect HTTP to HTTPS
      - "traefik.http.routers.frontend-insecure.rule=Host(`mhgreatsun.com`)"
      - "traefik.http.routers.frontend-insecure.entrypoints=web"
      - "traefik.http.routers.frontend-insecure.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - proxy

volumes:
  letsencrypt:

networks:
  proxy:
    driver: bridge