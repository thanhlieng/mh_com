version: "3.8"

services:
  backend-mh:
    build: ./MH-api
    container_name: backend-mh
    environment:
      DATABASE_URL: postgresql://thanh:123456@host.docker.internal:5432/mhcom_db
      NODE_ENV: local
    volumes:
      - mh_uploads:/usr/src/app/uploads
    networks:
      # - proxy
      - mh-internal
    restart: unless-stopped
    expose:
      - "3000"
    # Backend is not publicly exposed; only accessible via internal network
    # No Traefik labels here to keep it internal

  frontend-mh:
    build: ./MH
    container_name: frontend-mh
    depends_on:
      - backend-mh
    environment:
      NEXT_PUBLIC_API_URL: http://backend-mh:3000
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mh-frontend.rule=Host(`mhgreatsun.com`)"
      - "traefik.http.services.mh-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.mh-frontend.entrypoints=web"
      - "traefik.http.middlewares.mh-frontend-https.redirectscheme.scheme=https"
      - "traefik.http.routers.mh-frontend-secure.rule=Host(`mhgreatsun.com`)"
      - "traefik.http.routers.mh-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.mh-frontend-secure.tls.certresolver=letsencrypt"
    expose:
      - "3000"
    networks:
      - proxy
      - mh-internal
    restart: unless-stopped

volumes:
  mh_uploads:
    driver: local

networks:
  proxy:
    external: true
  mh-internal:
    driver: bridge
