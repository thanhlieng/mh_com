version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  backend:
    build: ./MH-api
    environment:
      DATABASE_URL: postgresql://thanh:123456@host.docker.internal:5432/mhcom_db
      NODE_ENV: local
    volumes:
      - ./uploads:/usr/src/app/uploads
    # Backend is not publicly exposed; only accessible via internal network
    networks:
      - proxy
    # No Traefik labels here to keep it internal

  frontend:
    build: ./MH
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000 # Frontend proxies to backend internally
      NODE_ENV: development
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.entrypoints=web"
    networks:
      - proxy

volumes:
  postgres_data:

networks:
  proxy:
    driver: bridge
